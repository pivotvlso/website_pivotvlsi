<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIVOT VLSI | Writing Practice Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../timing_diagram.css">
    <link rel="stylesheet" href="writing_practice_tool.css">
</head>
<body class="शरीरम्">
    <header id="शीर्षपट्टिका">
        <div id="चिह्नपात्रम्">
            <a href="../../index.html">
                <img src="../../home_page/company_logo.png" alt="PIVOT Logo" id="चिह्नम्">
            </a>
        </div>
        <ul id="मार्गसञ्चारकडी">
            <li><a href="../../index.html">Home</a></li>
            <li><a href="../../home_page/contact.html">Contact us</a></li>
        </ul>
    </header>

    <main class="मुख्यपात्रम्">
        <div class="उपकरणपट्टिका" style="position: relative; justify-content: center;">
            <button id="परीक्षणकीलः" class="उपकरणकीलः" style="position: absolute; left: 20px;"><i class="fas fa-check"></i> Check</button>
            <h2 id="पृष्ठशीर्षकम्" style="margin: 0; text-align: center; color: var(--text-primary);">Number system practice tool</h2>
        </div>
        <div id="अभ्याससारणी-पात्रम्" class="सारणी-पात्रम्">
            <table id="अभ्याससारणी">
                <colgroup>
                    <col style="width: 15%;"> <!-- S.No -->
                    <col style="width: 20%;"> <!-- Octal -->
                    <col style="width: 45%;"> <!-- Binary -->
                    <col style="width: 20%;"> <!-- Hexadecimal -->
                </colgroup>
                <thead id="सारणीशीर्षम्">
                    <tr>
                        <th>S.No</th>
                        <th>Octal</th>
                        <th>Binary</th>
                        <th>Hexadecimal</th>
                    </tr>
                </thead>
                <tbody id="सारणीशरीरम्">
                    <!-- Table body rows generated by JS -->
                </tbody>
            </table>
        </div>
    </main>
    <script src="writing_practice_tool.js" charset="utf-8"></script>
</body>
</html>
